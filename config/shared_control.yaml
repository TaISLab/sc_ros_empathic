# shared_control.yaml
# -------------------
# Gains / weights / model parameters for shared_control_node.py.
#
# Loaded into the node's PRIVATE namespace by shared_control.launch
# (<rosparam file="..." />), so every key here is read by the node as
# ~<key>. Anything set as a <param>/<arg> in the launch file overrides
# the value here.
#
# !!! PLACEHOLDER VALUES !!!  These are the pre-hardware-tuning numbers
# carried over from the offline simulation draft (paper Sec. IV-F/IV-G,
# which itself flags them as superseded). Re-tune on the FR3 with
# sim/tune_gains-style sweeps before recording human-subject data; do
# not treat any number below as validated on hardware.

# --- Loop / output shaping -------------------------------------------
# Conservative starting values for a velocity interface with loop
# latency. Raise v_max / Ka once the loop is confirmed stable.
rate_hz: 200.0            # Python loop rate (see node docstring: NOT 1 kHz)
v_max: 0.08              # EE Cartesian speed cap [m/s]
lpf_alpha: 0.15          # first-order LPF on the emergent command v_s (smaller = smoother)
dt_lookahead: 0.2         # horizon for the manipulability Jacobian prediction [s]

# --- Robot Jacobian source (manipulability factor) ---------------
# analytic: self-contained FR3 FK + Jacobian from q (fr3_model.py),
#           no PyKDL, per-candidate lookahead.  kdl: same via PyKDL.
#           topic: J published elsewhere (Float64MultiArray 6xN
#           row-major), time-propagated lookahead only.  none: disable.
jacobian_source: analytic
# robot_jacobian_topic: /taislab_controller/jacobian   # PLACEHOLDER (topic mode)
# robot_jacobian_rows: 6
# robot_jacobian_cols: 7
max_jacobian_age: 0.2     # s; topic mode: older -> factor dropped, warned

# --- Reactive path follower ----------------------------------------
# lookahead : v_r = cruise*tangent(x_d) + Ka*(x_d - x)  -- the [1] law;
#             cuts corners under lag -> traced circle < reference.
# crosstrack: v_r = cruise*tangent(s_near) + Ka*(P(s_near) - x) -- pull
#             to the nearest reference point; tracks the reference
#             radius (not the [1] law).
follower_mode: crosstrack
path_direction: forward   # forward | reverse -- which way round the circle is traced
Ka: 1.0                   # proportional gain, 1/s; was 2.0
rho_min: 0.02            # pure-pursuit lookahead when on the path [m] (larger -> smaller traced circle)
cruise_speed: 0.03       # tangential feed-forward around the circle [m/s]; 0 = proportional-only
lam: 1.02

# Trial length: end after this many laps (0 = until Ctrl-C). Paper's
# trial = 4 loops, first discarded as training. trial_end: 'shutdown'
# (node exits -> whole launch comes down, bag/CSV closed) or 'hold'
# (node stays at zero velocity, operator ends the session).
trial_laps: 0
trial_end: shutdown
# C/E only: hold zero velocity while joint_safety has no fresh q_h +
# l1,l2, so a session with joint_safety_h / m* all NaN cannot be
# recorded unnoticed. Recommended true for conditions C and E.
require_fresh_human: false

# --- Admittance model (force -> human-intent velocity v_h) ---------
admittance_mass:    [2.0, 2.0, 2.0]     # M_h, per Cartesian axis (larger = more sluggish)
admittance_damping: [40.0, 40.0, 40.0]  # B_h; steady-state v_h = f / B_h (larger = harder to push)
force_deadzone_N: 2.0     # raise (e.g. 3-5) if the robot still drifts when released
force_lpf_alpha: 0.1
# Startup tare: average O_F_ext_hat_K for this many seconds (HANDS OFF)
# and subtract it, so an EE payload not in the FR3 load model does not
# make the robot drift. 0 disables. Re-run mid-session: rosservice call
# /shared_control_node/tare
force_tare_s: 1.0

# --- Performance-factor exponential gains -------------------------
C1: 1.0                   # smoothness   eta_k1 = exp(-C1 |angle(v_k, v_prev)|)
C2: 1.0                   # directness   eta_k2 = exp(-C2 |angle(v_k, tangent)|)
Cs: 12.0                  # human joint-limit safety factor
Cm: 24.0                  # robot manipulability factor

# VISUALISATION ONLY: horizon (s) for ~diag/joint_deg_future = q_h +
# qdot_h * horizon (qdot_h = the v_h-induced joint velocity that
# joint_safety's dynamic term scores). Shows where v_h is pushing each
# joint on the joint plot; not used by the controller. 0 disables it.
joint_future_horizon_s: 1.0

# --- Performance-factor blend weights (w_i in eta_k = sum w_i eta_ki / sum w_i)
# For a clean B-vs-E comparison keep w_smoothness / w_directness identical
# across conditions; the node already only *activates* the factor subset
# its ~condition asks for, so these weights are simply ignored when the
# corresponding factor is inactive (conditions A/B/C/D).
w_smoothness: 1.0
w_directness: 1.0
w_joint_safety: 16.0
w_manipulability: 24.0

# --- Human joint-limit safety: pre-registered threshold ----------
# proximity_threshold = tau (paper Fig. 2b): the normalized margin
# below which the static proximity term starts to penalise. This IS
# homogeneous across volunteers -> it stays here.
proximity_threshold: 0.3
# The per-VOLUNTEER physiological joint ranges do NOT belong here:
# put them in config/subjects/<subject>.yaml (joint_limits_rad) and
# launch with subject:=SXX. ~human_joint_limits below is only an
# ad-hoc override (flat [q1min,q1max, ... ,q4min,q4max] rad); unset,
# and with no subject file, the study defaults
# (performance.DEFAULT_JOINT_LIMITS) are used.
# human_joint_limits: [-1.05, 3.14,  0.0, 3.14,  -1.57, 1.57,  0.0, 2.53]

# Per-joint zero offset (rad), SUBTRACTED from the pipeline's q1..q4 so
# its angle convention matches the DH model / joint_limits (q=0 at the
# goniometric neutral). Property of the visuo-tactile pipeline, not the
# volunteer. Affects the limits AND the arm Jacobian. Calibrate from a
# known neutral posture (see README "Checking joint_safety"). Example:
# pipeline reads q3 ~ pi/2 at neutral -> shift it back:
# human_joint_offsets: [0.0, 0.0, 1.5708, 0.0]

# --- Human-arm segment lengths ----------------------------------
# The visuo-tactile pipeline is expected to publish time-varying
# [l1, l2] on ~human_link_lengths_topic. The static fallback (used
# whenever that topic is silent/stale, so joint_safety keeps running)
# comes from config/subjects/<subject>.yaml (anthropometry.l1_m /
# l2_m). ~human_link_lengths below is only an ad-hoc override.
# human_link_lengths: [0.30, 0.27]

# --- Human-arm state staleness fail-safe -------------------------
# 0.2 s in the sibling package; 0.3 here. q_h always needs the live
# topic; l1/l2 fall back to human_link_lengths above when set.
max_human_state_age: 0.3   # s; stale q_h (or stale l1/l2 with no fallback) -> joint_safety dropped, warned
